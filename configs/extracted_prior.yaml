# Prior configuration for grasp optimization
# New format with explicit object state and hand poses

# Object state in world frame (Object_T_World)
# Default is at origin with identity rotation
object:
  translation: [0.0, 0.0, 0.0]
  rotation: [1.0, 0.0, 0.0, 0.0]  # quaternion [w, x, y, z]
  # joints: {}  # Future: for articulated objects

# Hand poses relative to object frame (Hand_T_Object)
# Supports multiple hands (currently single hand)
hands:
  - name: right_hand
    translation: [-0.0693, -0.0231, 0.0142]
    rotation: [-0.1599, 0.8038, 0.4762, 0.3187]  # quaternion [w, x, y, z]
    joints:
      index_joint_0: -0.1173
      index_joint_1: 0.4473
      index_joint_2: 0.7167
      index_joint_3: 0.6975
      middle_joint_0: 0.1546
      middle_joint_1: 0.5125
      middle_joint_2: 0.7815
      middle_joint_3: 0.5022
      ring_joint_0: -0.1864
      ring_joint_1: 0.1227
      ring_joint_2: 0.4539
      ring_joint_3: 0.3707
      thumb_joint_0: 1.2015
      thumb_joint_1: 0.1891
      thumb_joint_2: 0.683
      thumb_joint_3: 0.0384

# Contact sampling configuration
# Only allow contacts on index, middle, and thumb fingers (1-2 fingers in contact)
contact:
  mode: constrained
  links:
    - index_link_1
    - index_link_2
    - index_link_3
    - middle_link_1
    - middle_link_2
    - middle_link_3
    - thumb_link_2
    - thumb_link_3
  min_fingers: 3
  max_contacts_per_link: 4

# Jitter for batch diversity (applied to repeated priors)
jitter_translation: 0.05
jitter_rotation: 0.2
jitter_joints: 0.2

# # Weight for prior deviation energy
# prior_weight: 10.0
